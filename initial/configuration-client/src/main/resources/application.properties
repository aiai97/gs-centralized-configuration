spring.application.name=a-bootiful-client
spring.config.import=optional:configserver:http://localhost:8888/
management.endpoints.web.exposure.include=*

#spring.application.name: Identifies the application.
#spring.config.import: Specifies the Config Server address. The optional: prefix means that the Config Server is optional.
#management.endpoints.web.exposure.include: Exposes Actuator endpoints.